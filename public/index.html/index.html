<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#050907">
<title>Total Hub — Script Library</title>
<style>
:root{color-scheme:dark;--bg:#050907;--panel:#09120e;--line:#103526;--text:#f3fff9;--muted:#8aa99a;--green:#00f5a0;--green2:#00bd78;--pink:#e000b5}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(ellipse at 50% 10%,#041b11 0,transparent 55%),var(--bg);color:var(--text);font:14px Inter,system-ui,-apple-system,Segoe UI,Arial,sans-serif}
button,input{font:inherit}
.topbar{height:78px;border-bottom:1px solid #0e2b20;display:flex;align-items:center;justify-content:space-between;padding:0 clamp(18px,4.2vw,60px);gap:20px;background:#050807ef;position:sticky;top:0;z-index:5}
.logo{font-size:23px;font-weight:900;letter-spacing:-.7px;white-space:nowrap}
.logo span{color:var(--green)}
.nav{display:flex;gap:10px;align-items:center}
.nav a,.nav button{color:#fff;text-decoration:none;font-weight:750;padding:10px 17px;border:1px solid #10281e;border-radius:9px;background:#070d0a;cursor:pointer}
.nav .discord{background:#5865f2;border-color:#5865f2}
.nav .youtube{background:#f00;border-color:#f00}
.nav .help{color:var(--green);border-color:var(--green)}
.wrap{width:min(1160px,calc(100% - 36px));margin:42px auto 60px}
.hero{text-align:center;margin-bottom:58px}
.hero h1{font-size:clamp(30px,4vw,40px);letter-spacing:-1.2px;margin:0 0 26px}
.searchrow{display:flex;gap:10px;max-width:510px;margin:auto}
.searchrow input{min-width:0;flex:1;background:#080f0b;border:1px solid var(--line);border-radius:13px;padding:16px 20px;color:var(--text);outline:none}
.searchrow input:focus{border-color:var(--green)}
.iconbtn{width:57px;border:1px solid var(--line);border-radius:13px;background:#08120c;color:#e8dff5;font-size:19px;cursor:pointer}
.filters{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:15px}
.filter{padding:9px 16px;border:1px solid var(--line);border-radius:22px;background:#07100b;color:#90b4a2;cursor:pointer}
.filter.active{background:var(--green);color:#001b10;border-color:var(--green)}
.filter.random{background:linear-gradient(110deg,#f00098,#9900e8);border-color:transparent;color:white}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}
.script-card{border:1px solid var(--line);background:rgba(8,17,12,.96);border-radius:17px;padding:22px 24px 24px;min-width:0;display:flex;flex-direction:column;min-height:272px;transition:border-color .15s,transform .15s,box-shadow .2s}
.script-card:hover{border-color:var(--green);transform:translateY(-3px);box-shadow:0 8px 35px #00f5a018}
.cardhead{display:flex;align-items:flex-start;gap:11px}
.orb{flex:0 0 18px;height:18px;border-radius:50%;margin-top:4px;background:linear-gradient(135deg,#c4ffe1,#00bd78);box-shadow:0 0 14px #00f5a022}
.orb.gold{background:linear-gradient(135deg,#ffe7a1,#d99825)}
.cardtitle{font-size:17px;line-height:1.3;font-weight:800;flex:1}
.star{border:0;background:none;color:#8aa99a;font-size:21px;cursor:pointer;padding:0 2px}
.star.saved{color:#ffe27a}
.tag{font-size:10px;font-weight:900;color:var(--green);background:#06291b;border:1px solid #0d432e;border-radius:7px;padding:5px 8px;white-space:nowrap}
.desc{color:var(--muted);line-height:1.5;min-height:43px;margin:12px 0 19px}
.codebox{height:48px;overflow:auto;white-space:nowrap;border:1px solid #103626;border-radius:9px;background:#030906;color:#91b6a1;padding:13px 12px;font:11.5px ui-monospace,SFMono-Regular,Consolas,monospace;scrollbar-color:var(--green) #04130b;scrollbar-width:thin;cursor:pointer}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:22px}
.actions button{border:1px solid var(--green2);border-radius:9px;padding:11px 10px;background:transparent;color:var(--green);font-weight:800;cursor:pointer}
.actions .download{border-color:#789687;color:#e5f1eb}
.actions button:hover{background:#082619}
.empty{text-align:center;color:var(--muted);padding:40px;grid-column:1/-1}
.footer{text-align:center;color:#537363;font-size:12px;padding:25px;border-top:1px solid #0c261b}
.modalback{position:fixed;inset:0;background:#000a;display:none;align-items:center;justify-content:center;padding:20px;z-index:10}
.modalback.open{display:flex}
.modal{width:min(440px,100%);border:1px solid var(--line);border-radius:16px;background:#08110c;padding:24px}
.modal h2{margin-top:0}
.modalhead{display:flex;align-items:center;justify-content:space-between}
.modalhead h2{margin:0 0 15px}
.closex{font-size:24px!important;padding:3px 10px!important;background:transparent!important;color:var(--text)!important}
.helpmodal{width:min(760px,100%);max-height:85vh;overflow:auto}
.helpTabs{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}
.helpTab{background:#07100b!important;color:#90b4a2!important;border:1px solid var(--line)!important}
.helpTab.active{background:var(--green)!important;color:#00190e!important}
.helpContent{color:var(--muted);line-height:1.65}
.executorGrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.executorItem{display:block;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:#050b07;color:var(--text);text-decoration:none}
.executorItem strong{display:block;color:var(--green)}
.executorItem small{color:var(--muted)}
.helpContent ul{padding-left:22px}
.statusline{margin:12px 0}
.settingsmodal{width:min(400px,100%);background:#050907;border:1px solid #103526;border-radius:17px;padding:24px;box-shadow:0 18px 70px #0009}
.settingsmodal .modalhead h2{font-size:18px;margin:0}
.settingsmodal .modalhead{margin-bottom:20px}
.settingsmodal .closex{color:#789687!important;padding:0 4px!important}
.setting-section{margin-top:20px}
.setting-label{display:block;color:#8aa99a;font-weight:750;margin-bottom:10px}
.colors{display:flex;gap:9px;flex-wrap:wrap}
.color-choice{width:32px;height:32px;border-radius:50%;padding:0!important;border:2px solid transparent!important;box-shadow:none!important;cursor:pointer}
.color-choice.selected{outline:2px solid white;outline-offset:2px}
.pref-row{display:flex;align-items:center;justify-content:space-between;gap:16px;margin:14px 0;color:var(--text)}
.pref-row input{width:16px;height:16px;accent-color:var(--green);cursor:pointer}
.neon-glow .script-card{box-shadow:0 0 18px color-mix(in srgb,var(--green) 12%,transparent)}
.glass-blur .script-card{background:rgba(8,17,12,.72);backdrop-filter:blur(12px)}
.no-animations *, .no-animations *:before, .no-animations *:after{animation:none!important;transition:none!important;scroll-behavior:auto!important}
.light-mode{--bg:#edf7f1;--panel:#fff;--line:#b8d9c8;--text:#10271c;--muted:#557565;color-scheme:light;background:radial-gradient(ellipse at 50% 10%,#d7f5e6 0,transparent 55%),var(--bg)}
.light-mode .topbar{background:#f6fff9ed}
.light-mode .script-card,.light-mode .modal,.light-mode .settingsmodal{background:#fff}
.light-mode .codebox,.light-mode .searchrow input,.light-mode .filter,.light-mode .iconbtn{background:#f6fbf8;color:#264c39}
.light-mode .codebox{color:#456b57}
.compact .script-card{padding:15px;min-height:0}
.compact .desc{margin:8px 0;min-height:0}
.compact .actions{margin-top:12px}
.modal button{cursor:pointer}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--green);color:#00180e;padding:11px 17px;border-radius:10px;font-weight:800;display:none;z-index:20}
.toast.show{display:block}
.mouse-glow{position:fixed;inset:0;pointer-events:none;z-index:4;overflow:hidden}
.mouse-glow::before{content:"";position:absolute;width:240px;height:240px;border-radius:50%;background:radial-gradient(circle,#00f5a018 0,transparent 70%);transform:translate(-50%,-50%);left:var(--mx,-300px);top:var(--my,-300px)}
.trail-dot{position:absolute;width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 12px var(--green),0 0 25px #00f5a088;transform:translate(-50%,-50%);opacity:0;transition:opacity .2s}
@media(max-width:850px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.topbar{padding-inline:18px}.nav a,.nav button{padding:9px 11px}}
@media(max-width:600px){.topbar{height:auto;min-height:70px;align-items:flex-start;padding-block:15px;flex-direction:column}.nav{flex-wrap:wrap}.wrap{margin-top:32px}.hero{margin-bottom:36px}.grid{grid-template-columns:1fr}.script-card{min-height:0}.desc{min-height:0}.mouse-glow{display:none}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{scroll-behavior:auto!important;animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="mouse-glow" id="mouseGlow" aria-hidden="true"></div>
<header class="topbar">
<div class="logo">Total <span>Hub</span></div>
<nav class="nav" aria-label="Main navigation">
<a class="discord" href="https://discord.com/invite/FSkhEtBnaP" target="_blank" rel="noopener">Discord</a>
<a class="youtube" href="https://www.youtube.com/@sigmaayyyy" target="_blank" rel="noopener">YouTube</a>
<button class="help" id="helpBtn">Help &amp; Tools 🚀</button>
<button id="settingsBtn">Settings</button>
</nav>
</header>

<main class="wrap" id="scripts">
<section class="hero">
<h1>All Scripts from Total</h1>
<div class="searchrow">
<input id="search" type="search" placeholder="Search scripts or links..." aria-label="Search scripts">
<button class="iconbtn" id="showAll" title="Clear search" aria-label="Clear search">▤</button>
</div>
<div class="filters" role="group" aria-label="Filter scripts">
<button class="filter active" data-filter="All">All</button>
<button class="filter" data-filter="AutoFarm">AutoFarm</button>
<button class="filter" data-filter="Hubs">Hubs</button>
<button class="filter" data-filter="Favorites">Favorites</button>
<button class="filter random" id="randomBtn">Random</button>
</div>
</section>
<section class="grid" id="grid" aria-live="polite"></section>
</main>

<footer class="footer">Total Hub · Script library · Use scripts only where you have permission.</footer>

<div class="modalback" id="helpModal" role="dialog" aria-modal="true" aria-labelledby="helpTitle">
<section class="modal helpmodal">
<div class="modalhead"><h2 id="helpTitle">Help &amp; Tools</h2><button id="closeHelp" class="closex" aria-label="Close">×</button></div>
<div class="helpTabs" role="tablist">
<button class="helpTab active" data-help-tab="Executors">Executors</button>
<button class="helpTab" data-help-tab="Guide">Guide</button>
<button class="helpTab" data-help-tab="Statuses">Statuses</button>
</div>
<div id="helpContent" class="helpContent"></div>
</section>
</div>

<div class="modalback" id="settingsModal" role="dialog" aria-modal="true" aria-labelledby="settingsTitle">
<section class="modal settingsmodal">
<div class="modalhead"><h2 id="settingsTitle">Hub Settings</h2><button id="closeSettings" class="closex" aria-label="Close">×</button></div>
<div class="setting-section">
<span class="setting-label">Theme Accent Color</span>
<div class="colors">
<button class="color-choice selected" data-accent="#00f5a0" style="background:#00f5a0" aria-label="Green"></button>
<button class="color-choice" data-accent="#00d9ff" style="background:#00d9ff" aria-label="Cyan"></button>
<button class="color-choice" data-accent="#b455ff" style="background:#b455ff" aria-label="Purple"></button>
<button class="color-choice" data-accent="#ff3268" style="background:#ff3268" aria-label="Pink"></button>
<button class="color-choice" data-accent="#ffad00" style="background:#ffad00" aria-label="Orange"></button>
<button class="color-choice" data-accent="#008cff" style="background:#008cff" aria-label="Blue"></button>
</div>
</div>
<div class="setting-section">
<span class="setting-label">Interface Preferences</span>
<label class="pref-row">Neon Glow Effect <input type="checkbox" id="glowToggle"></label>
<label class="pref-row">Glassmorphism Blur <input type="checkbox" id="glassToggle" checked></label>
<label class="pref-row">Smooth Animations <input type="checkbox" id="animationsToggle" checked></label>
<label class="pref-row">Light Theme Mode <input type="checkbox" id="lightToggle"></label>
<label class="pref-row">Compact Mode (Hide Text) <input type="checkbox" id="compactToggle"></label>
</div>
</section>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
'use strict';

const candyScript='loadstring(game:HttpGet("https://raw.githubusercontent.com/sigmaayyy/candy-farm/refs/heads/main/candy-corn-farm"))()';
const scripts=[
{name:'Total Script Hub',category:'Hubs',desc:'The single ultimate core hub containing all main features.',code:'loadstring(game:HttpGet("https://raw.githubusercontent.com/sigmaayyy/totalhub/refs/heads/main/total-hub-official-script"))()',filename:'total-script-hub.lua'},
{name:'CandyCorn Farm',category:'AutoFarm',desc:'Farm CandyCorns with the CandyCorn Farm script.',code:candyScript,filename:'candycorn-farm.lua'},
{name:'SLAP+SLAPPLE FARM SCRIPT',category:'AutoFarm',desc:'Slap and Slapple farm script.',code:'loadstring(game:HttpGet("https://raw.githubusercontent.com/sigmaayyy/Total-Farm/refs/heads/main/total-slap-farm.lua"))()',filename:'slap-slapple-farm.lua'},
{name:"Nexer's Slap Autofarm",category:'AutoFarm',desc:'Slap autofarm script provided by Nexer.',code:'loadstring(game:HttpGet("https://raw.githubusercontent.com/NewNexer/NexerHub/refs/heads/main/SB/SFs/netzachtheme"))()',filename:'nexer-slap-autofarm.lua',gold:true},
{name:'1 Player Server',category:'AutoFarm',desc:'Creates a 1-player server for safer, uninterrupted farming.',code:'loadstring(game:HttpGet("https://raw.githubusercontent.com/sigmaayyy/1-player-server/refs/heads/main/1-player.lua"))()',filename:'1-player-server.lua'},
{name:'Bot Autofarm',category:'AutoFarm',desc:'External bot autofarm early access.',code:'https://work.ink/1ZPB/bot-autofarm-early-access',filename:'bot-autofarm.txt'},
{name:'Dual Autofarm [Finished Development]',category:'AutoFarm',desc:'Completed dual autofarm external service.',code:'https://work.ink/1ZPB/dual-autofarm-finished-development',filename:'dual-autofarm.txt'}
];

let currentFilter='All';
const favorites=new Set();
const grid=document.getElementById('grid');
const search=document.getElementById('search');
const toast=document.getElementById('toast');
let toastTimer;

function notify(msg){
toast.textContent=msg;
toast.classList.add('show');
clearTimeout(toastTimer);
toastTimer=setTimeout(()=>toast.classList.remove('show'),1900);
}
function escapeHtml(s){
return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function getShownScripts(){
const q=search.value.trim().toLowerCase();
return scripts.filter(s=>
(currentFilter==='All'||(currentFilter==='Favorites'?favorites.has(s.name):s.category===currentFilter)) &&
(!q||(s.name+' '+s.desc+' '+s.code).toLowerCase().includes(q))
);
}
async function copyText(text){
try{
await navigator.clipboard.writeText(text);
notify('Script copied!');
}catch{
const t=document.createElement('textarea');
t.value=text;
t.style.position='fixed';
t.style.opacity='0';
document.body.appendChild(t);
t.select();
try{
const ok=document.execCommand('copy');
notify(ok?'Script copied!':'Copy blocked by browser');
}catch{
notify('Copy blocked by browser');
}
t.remove();
}
}
function render(){
const shown=getShownScripts();
grid.innerHTML='';
if(!shown.length){
grid.innerHTML='<div class="empty">No scripts found. Try another search.</div>';
return;
}
shown.forEach(s=>{
const card=document.createElement('article');
card.className='script-card';
card.innerHTML=`
<div class="cardhead">
<span class="orb ${s.gold?'gold':''}"></span>
<div class="cardtitle">${escapeHtml(s.name)}</div>
<button class="star ${favorites.has(s.name)?'saved':''}" title="Toggle favorite" aria-label="Toggle favorite">${favorites.has(s.name)?'★':'☆'}</button>
<span class="tag">${s.category==='Hubs'?'HUB':'FARM'}</span>
</div>
<p class="desc">${escapeHtml(s.desc)}</p>
<div class="codebox" tabindex="0" title="Double-click to copy">${escapeHtml(s.code)}</div>
<div class="actions"><button class="copy">Copy</button><button class="download">Download</button></div>`;
card.querySelector('.star').addEventListener('click',()=>{
favorites.has(s.name)?favorites.delete(s.name):favorites.add(s.name);
render();
});
card.querySelector('.copy').addEventListener('click',()=>copyText(s.code));
card.querySelector('.codebox').addEventListener('dblclick',()=>copyText(s.code));
card.querySelector('.download').addEventListener('click',()=>{
const blob=new Blob([s.code+'\n'],{type:'text/plain;charset=utf-8'});
const url=URL.createObjectURL(blob);
const a=document.createElement('a');
a.href=url;
a.download=s.filename;
document.body.appendChild(a);
a.click();
a.remove();
setTimeout(()=>URL.revokeObjectURL(url),1000);
notify('Download started');
});
grid.appendChild(card);
});
}

document.querySelectorAll('[data-filter]').forEach(b=>b.addEventListener('click',()=>{
currentFilter=b.dataset.filter;
document.querySelectorAll('[data-filter]').forEach(x=>x.classList.toggle('active',x===b));
render();
}));
search.addEventListener('input',render);
document.getElementById('showAll').addEventListener('click',()=>{
search.value='';
currentFilter='All';
document.querySelectorAll('[data-filter]').forEach(x=>x.classList.toggle('active',x.dataset.filter==='All'));
render();
});
document.getElementById('randomBtn').addEventListener('click',()=>{
const q=search.value.toLowerCase();
const list=scripts.filter(s=>(s.name+' '+s.desc+' '+s.code).toLowerCase().includes(q));
const pool=list.length?list:scripts;
const s=pool[Math.floor(Math.random()*pool.length)];
search.value=s.name;
currentFilter='All';
document.querySelectorAll('[data-filter]').forEach(x=>x.classList.toggle('active',x.dataset.filter==='All'));
render();
notify('Random pick: '+s.name);
});

const settingsModal=document.getElementById('settingsModal');
document.getElementById('settingsBtn').addEventListener('click',()=>settingsModal.classList.add('open'));
document.getElementById('closeSettings').addEventListener('click',()=>settingsModal.classList.remove('open'));
settingsModal.addEventListener('click',e=>{if(e.target===settingsModal)settingsModal.classList.remove('open')});

const settingsPrefs={
glowToggle:'neon-glow',
glassToggle:'glass-blur',
animationsToggle:'no-animations',
lightToggle:'light-mode',
compactToggle:'compact'
};
Object.entries(settingsPrefs).forEach(([id,cls])=>{
const el=document.getElementById(id);
try{el.checked=localStorage.getItem('totalhub-'+id)==='true';}catch{}
document.body.classList.toggle(cls,id==='animationsToggle'?!el.checked:el.checked);
el.addEventListener('change',()=>{
document.body.classList.toggle(cls,id==='animationsToggle'?!el.checked:el.checked);
try{localStorage.setItem('totalhub-'+id,String(el.checked));}catch{}
});
});
document.querySelectorAll('[data-accent]').forEach(btn=>{
let saved=null;
try{saved=localStorage.getItem('totalhub-accent');}catch{}
if(saved){
document.documentElement.style.setProperty('--green',saved);
document.documentElement.style.setProperty('--green2',saved);
document.querySelectorAll('[data-accent]').forEach(x=>x.classList.toggle('selected',x.dataset.accent===saved));
}
btn.addEventListener('click',()=>{
const color=btn.dataset.accent;
document.documentElement.style.setProperty('--green',color);
document.documentElement.style.setProperty('--green2',color);
document.querySelectorAll('[data-accent]').forEach(x=>x.classList.toggle('selected',x===btn));
try{localStorage.setItem('totalhub-accent',color);}catch{}
});
});

const helpModal=document.getElementById('helpModal');
const helpContent=document.getElementById('helpContent');
const executorItems=[
['Delta','https://weao.xyz/'],['Codex','https://weao.xyz/'],
['Fluxus','https://weao.xyz/'],['Hydrogen','https://weao.xyz/'],
['Arceus X','https://weao.xyz/'],['Trigon Evo','https://weao.xyz/'],
['Vega X','https://weao.xyz/'],['Cubix','https://weao.xyz/'],
['Cryptic','https://weao.xyz/'],['Evon','https://weao.xyz/'],
['Wave','https://weao.xyz/'],['Solara','https://weao.xyz/']
];
function showHelpTab(tab){
document.querySelectorAll('[data-help-tab]').forEach(b=>b.classList.toggle('active',b.dataset.helpTab===tab));
if(tab==='Executors'){
helpContent.innerHTML='<p>Executor information and availability can change. Open WEAO for current compatibility and details.</p><div class="executorGrid">'+executorItems.map(([name,url])=>`<a class="executorItem" href="${url}" target="_blank" rel="noopener"><strong>${name}</strong><small>View current details on WEAO ↗</small></a>`).join('')+'</div><p><a href="https://weao.xyz/" target="_blank" rel="noopener" style="color:var(--green)">Open WEAO website ↗</a></p>';
}else if(tab==='Guide'){
helpContent.innerHTML='<h3>Welcome to Total Hub! Website guide:</h3><ul><li><strong>Copying a script:</strong> Double-click on the dark code field or click the “Copy” button.</li><li><strong>Favorites:</strong> The star (☆) in the top right corner of the card saves the script to the “Favorites” category.</li><li><strong>Search &amp; Categories:</strong> Use the buttons below the search bar to filter scripts.</li><li><strong>Executors:</strong> Go to the “Executors” tab above. Click an entry to open WEAO for current information.</li><li><strong>Statuses:</strong> Check the meaning of the colors in the “Statuses” tab.</li></ul>';
}else{
helpContent.innerHTML='<div class="statusline">🟢 <strong>Script is fully working.</strong></div><div class="statusline">🟡 <strong>Experiencing issues, will be fixed soon, but script still functions.</strong></div><div class="statusline">🔴 <strong>Script is disabled/patched (fix might appear).</strong></div><div class="statusline">⚫️ <strong>Script is not working (fix unavailable).</strong></div><div class="statusline">🟠 <strong>Script is currently in development.</strong></div>';
}
}
document.getElementById('helpBtn').addEventListener('click',()=>{
helpModal.classList.add('open');
showHelpTab('Executors');
});
document.getElementById('closeHelp').addEventListener('click',()=>helpModal.classList.remove('open'));
helpModal.addEventListener('click',e=>{if(e.target===helpModal)helpModal.classList.remove('open')});
document.querySelectorAll('[data-help-tab]').forEach(b=>b.addEventListener('click',()=>showHelpTab(b.dataset.helpTab)));

document.addEventListener('keydown',e=>{
if(e.key==='Escape'){
settingsModal.classList.remove('open');
helpModal.classList.remove('open');
}
});

/* PC-only ambient mouse glow and trailing particles */
const canHover=window.matchMedia('(hover: hover) and (pointer: fine)').matches;
const glow=document.getElementById('mouseGlow');
if(canHover){
const dots=[];
for(let i=0;i<12;i++){
const d=document.createElement('span');
d.className='trail-dot';
glow.appendChild(d);
dots.push({el:d,x:-100,y:-100});
}
let mx=-300,my=-300,frame=0;
window.addEventListener('pointermove',e=>{
mx=e.clientX;
my=e.clientY;
glow.style.setProperty('--mx',mx+'px');
glow.style.setProperty('--my',my+'px');
dots[frame%dots.length].x=mx;
dots[frame%dots.length].y=my;
dots[frame%dots.length].el.style.left=mx+'px';
dots[frame%dots.length].el.style.top=my+'px';
dots[frame%dots.length].el.style.opacity='0.85';
dots[frame%dots.length].el.animate([{opacity:.85,transform:'translate(-50%,-50%) scale(1)'},{opacity:0,transform:'translate(-50%,-50%) scale(.1)'}],{duration:650,easing:'ease-out'});
frame++;
},{passive:true});
}
render();
</script>
</body>
</html>
